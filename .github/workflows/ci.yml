# CI：前端 + Rust 全量测试，随后在 Windows 上打包 NSIS（.exe）与 MSI（.msi）安装包。
#
# 与本机开发链路保持一致：
#   测试 = npm --prefix ui run test + cargo test --workspace
#   打包 = 在 gui/ 目录跑 tauri build（beforeBuildCommand 自动执行 ui 构建）
# Tauri 打包机（NSIS / WiX）由 tauri-bundler 按需自动下载，无需预装。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试（前端 + Rust）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm --prefix ui ci

      - name: 前端测试（Vitest + jsdom）
        run: npm --prefix ui run test

      - name: Rust 测试（cargo test --workspace）
        run: cargo test --workspace

      - name: 前端类型检查与构建（tsc --noEmit + vite build）
        run: npm --prefix ui run build

  package:
    name: 打包安装包（NSIS exe + MSI）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm --prefix ui ci

      # 本机开发时 tauri CLI 是全局安装的，CI 里显式装一份同样的主版本。
      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # working-directory: gui → npm 沿目录上溯找到根 package.json，
      # beforeBuildCommand（npm run build）即 ui 的 tsc + vite 构建。
      - name: tauri build（NSIS + MSI）
        working-directory: gui
        run: npx tauri build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: NanoHermes-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # 版本驱动发布：推送 main 时读取 gui/tauri.conf.json 里的版本号，
  # 如果远端还没有对应的 v* tag，就在测试与打包都通过后自动打 tag 并发布
  # Release。版本号没变的普通提交不会重复发版；也可以继续手动推送 v* tag。
  version:
    name: 检测版本 tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本并检查远端 tag
        id: ver
        shell: bash
        run: |
          version=$(jq -r '.version' gui/tauri.conf.json)
          tag="v$version"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            release=false
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "版本 $version，tag $tag，是否发布：$release"

  # 手动推送 v* 标签仍可发布；main 上的版本号变化由 version 任务自动发布。
  release:
    name: 发布 GitHub Release
    needs: [version, package]
    if: |
      always() && needs.package.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 下载安装包产物
        uses: actions/download-artifact@v4
        with:
          name: NanoHermes-installers
          path: installers

      # tag 不存在时，GitHub Releases API 会按 target_commitish 自动创建它。
      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag || github.ref_name }}
          name: NanoHermes ${{ needs.version.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            installers/nsis/*.exe
            installers/msi/*.msi
