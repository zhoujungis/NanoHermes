# CI：前端 + Rust 全量测试，随后在 Windows 上打包 NSIS（.exe）与 MSI（.msi）安装包。
#
# 与本机开发链路保持一致：
#   测试 = npm --prefix ui run test + cargo test --workspace
#   打包 = 在 gui/ 目录跑 tauri build（beforeBuildCommand 自动执行 ui 构建）
# Tauri 打包机（NSIS / WiX）由 tauri-bundler 按需自动下载，无需预装。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试（前端 + Rust）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm --prefix ui ci

      - name: 前端测试（Vitest + jsdom）
        run: npm --prefix ui run test

      - name: Rust 测试（cargo test --workspace）
        run: cargo test --workspace

      - name: 前端类型检查与构建（tsc --noEmit + vite build）
        run: npm --prefix ui run build

  package:
    name: 打包安装包（NSIS exe + MSI）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm --prefix ui ci

      # 本机开发时 tauri CLI 是全局安装的，CI 里显式装一份同样的主版本。
      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # working-directory: gui → npm 沿目录上溯找到根 package.json，
      # beforeBuildCommand（npm run build）即 ui 的 tsc + vite 构建。
      - name: tauri build（NSIS + MSI）
        working-directory: gui
        run: npx tauri build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: NanoHermes-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
